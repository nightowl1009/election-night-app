/* The page never moves sideways: the viewport clips anything wider than the screen, and so does each tab's panel.
   (Only the root gets 'hidden' — on the viewport it doesn't stop the tab bar or swipe rows from scrolling.) */
html { overflow-x: hidden; }
.en-panel { overflow-x: clip; max-width: 100%; }
.en-panel svg, .en-panel img, .en-panel canvas { max-width: 100%; }
/* No double-tap zoom: 'manipulation' keeps scrolling and taps but drops double-tap zoom (iPhone honors it per element).
   Rows that scroll sideways (tabs, swipe cards, chips) are told outright they may pan both ways. */
html, body, body * { touch-action: manipulation; }
.en-tabs, .en-tabs *, .en-hbtns, .en-hbtns *, .en-swipe-track, .en-swipe-track *, #pool-root .en-seg, #pool-root .en-seg *, .pl-pgrid, .pl-pgrid *, .pl-quick, .pl-quick * { touch-action: pan-x pan-y; }</style>
<script>
/* No pinch zoom: it's an app, not a web page. iPhone Safari ignores user-scalable=no, so block its pinch gestures too.
   Double-tap zoom is off through touch-action (CSS above), which keeps quick double taps on buttons working. */
(function () {
  const stop = (e) => { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>

#vote-splash .vs-word span:nth-child(1) { animation-delay: .30s; color: #60a5fa; } #vote-splash .vs-word span:nth-child(2) { animation-delay: .42s; }

#vote-splash .vs-stripe i { flex: 1; } #vote-splash .vs-stripe i:nth-child(1) { background: #3b82f6; } #vote-splash .vs-stripe i:nth-child(2) { background: #fff; } #vote-splash .vs-stripe i:nth-child(3) { background: #ef4444; }
#vote-splash .vs-sub { margin-top: 8px; font-family: "Instrument Sans", system-ui, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: rgba(255,255,255,.75); opacity: 0; animation: vs-fade .7s ease-out 1.3s forwards; }

#vote-splash .vs-pals { position: absolute; left: 0; right: 0; bottom: max(5vh, 26px); display: flex; justify-content: space-between; padding: 0 5vw; pointer-events: none; z-index: 1; }
#vote-splash .vs-pal { width: min(48vw, 250px, 23vh); height: auto; opacity: 0; overflow: visible; filter: drop-shadow(0 10px 22px rgba(0,0,0,.5)); }
/* They walk in at a steady pace: constant speed so the feet don't slide, legs swing smoothly from the hip
   (opposite pairs together), the body lifts gently on each step, the head nods and the tail swishes.
   Walk = 3 full strides of .8s = 2.4s, so the legs land back under the body right as they arrive. */
#vote-splash .vs-pal { will-change: transform, opacity; }
#vote-splash .vs-pal.d { transform: translateX(-115%); animation: vs-walk-d 2.4s linear .6s forwards; }
#vote-splash .vs-pal.r { transform: translateX(115%); animation: vs-walk-r 2.4s linear .7s forwards; }
#vote-splash .vs-pal .leg, #vote-splash .vs-pal .head, #vote-splash .vs-pal .tail, #vote-splash .vs-pal .body { transform-box: fill-box; will-change: transform; }
#vote-splash .vs-pal .leg { transform-origin: 50% 4%; animation: vs-leg .8s linear .6s 3; }
#vote-splash .vs-pal .leg.b { animation-name: vs-leg-b; }
#vote-splash .vs-pal .body { animation: vs-lift .4s cubic-bezier(.37,0,.63,1) .6s 6 alternate; }
#vote-splash .vs-pal .head { transform-origin: 10% 90%; animation: vs-nod .8s linear .6s 3; }
#vote-splash .vs-pal.r .head { transform-origin: 30% 70%; }
#vote-splash .vs-pal .tail { transform-origin: 100% 0%; animation: vs-swish .8s linear .6s 3; }
#vote-splash .vs-pal.r .leg, #vote-splash .vs-pal.r .body, #vote-splash .vs-pal.r .head, #vote-splash .vs-pal.r .tail { animation-delay: .7s; }

@keyframes vs-leg { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(.33,1,.68,1); } 25% { transform: rotate(16deg); animation-timing-function: cubic-bezier(.37,0,.63,1); } 75% { transform: rotate(-16deg); animation-timing-function: cubic-bezier(.32,0,.67,0); } 100% { transform: rotate(0); } }
@keyframes vs-leg-b { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(.33,1,.68,1); } 25% { transform: rotate(-16deg); animation-timing-function: cubic-bezier(.37,0,.63,1); } 75% { transform: rotate(16deg); animation-timing-function: cubic-bezier(.32,0,.67,0); } 100% { transform: rotate(0); } }
@keyframes vs-lift { from { transform: translateY(0); } to { transform: translateY(-1.8%); } }

@keyframes vs-swish { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(.33,1,.68,1); } 25% { transform: rotate(9deg); animation-timing-function: cubic-bezier(.37,0,.63,1); } 75% { transform: rotate(-6deg); animation-timing-function: cubic-bezier(.32,0,.67,0); } 100% { transform: rotate(0); } }

#vote-splash .vs-star { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:0; animation: vs-twinkle 1.6s ease-in-out infinite; box-shadow: 0 0 6px 1px rgba(255,255,255,.7); }

#vote-splash .vs-word span:nth-child(1) { animation-delay: .30s, 1.1s; } #vote-splash .vs-word span:nth-child(2) { animation-delay: .42s, 1.2s; }
