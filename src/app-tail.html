
<p class="app-updated" id="app-updated"></p>
</div>
<div class="app-install" id="app-install" hidden><span id="app-install-msg">Install Election Night as an app</span><button class="go" id="app-install-go">Install</button><button class="x" id="app-install-x" aria-label="Dismiss">✕</button></div>
<script>
(function () {
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const bar = document.getElementById('app-install'), go = document.getElementById('app-install-go'), msg = document.getElementById('app-install-msg');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let dismissed = false; try { dismissed = localStorage.getItem('en-install-x') === '1'; } catch (e) {}
  if (standalone) return;
  let deferred = null;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const iosMsg = 'Install: tap Share, then “Add to Home Screen”';
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; if (!dismissed) bar.hidden = false; });
  go.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; bar.hidden = true; });
  const host = document.getElementById('app-updated');
  if (host) {   // always-available link, even after the banner was dismissed
    const l = document.createElement('button'); l.type = 'button'; l.className = 'sim-go'; l.id = 'inst-go';
    l.innerHTML = '📲 Install the app<small>' + (ios ? 'On iPhone: tap the Share button, then “Add to Home Screen”' : 'Adds Election Night to your home screen or desktop') + '</small>';
    l.addEventListener('click', () => { if (deferred) { go.click(); return; } msg.textContent = ios ? iosMsg : 'Use your browser menu → Install app / Add to Home Screen'; go.hidden = true; bar.hidden = false; });
    host.after(l);
  }
  document.getElementById('app-install-x').addEventListener('click', () => { bar.hidden = true; try { localStorage.setItem('en-install-x', '1'); } catch (e) {} });
  if (ios && !dismissed) { msg.textContent = iosMsg; go.hidden = true; bar.hidden = false; }
})();
</script>
</body>
</html>
